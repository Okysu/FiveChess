# Release: pushing a tag that starts with "v" (e.g. v1.0.1) builds the PC installers and the Android APK and
# publishes them as a GitHub Release whose notes come from src/data/changelog.json.
#
# Optional repository secrets for a release-signed APK (otherwise the APK is debug-signed):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks keystore file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json and has a changelog entry
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; fi
          npx tsx scripts/changelog.ts --notes="$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm test

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # electron downloads its runtime on first use; electron-builder packs that copy (electronDist)
      - run: npx electron --version
      - run: npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: |
            release/mingque-setup-*.exe
            release/mingque-portable-*.exe
          if-no-files-found: error

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # the runner image ships an Android SDK (ANDROID_HOME); add the platform / build tools this project needs
      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync android
      - name: Signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mingque.jks"
            echo "MINGQUE_KEYSTORE=$RUNNER_TEMP/mingque.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          MINGQUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINGQUE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINGQUE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-build.mjs --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/mingque-*.apk
          if-no-files-found: error

  publish:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Release notes from the changelog
        run: npx tsx scripts/changelog.ts --notes="${{ needs.check.outputs.version }}" > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --title "命阙 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
