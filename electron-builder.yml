# Desktop client packaging (npm run desktop:pack → release/)
appId: com.okysu.mingque
productName: 命阙
executableName: mingque
copyright: Copyright © 2026 Okysu
directories:
  output: release
  buildResources: electron
files:
  - dist/**
  - electron/main.cjs
  - electron/preload.cjs
  - electron/icon.png
  - package.json
  - "!node_modules/**"
asar: true
# reuse the runtime npm already unpacked (avoids re-extracting electron.exe, which antivirus scanners lock)
electronDist: node_modules/electron/dist
# media is served straight from the archive by the app:// handler; nothing needs unpacking
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: electron/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: 命阙
  artifactName: mingque-setup-${version}.${ext}
  language: 2052
  installerLanguages: [zh_CN]
portable:
  artifactName: mingque-portable-${version}.${ext}
