<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0806" />
    <title>命阙</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0806; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      /* boot overlay (outside the game view; removed once the game renders) */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1b1512 url("/ui/tex_ink.webp") center / cover; color: #eadbb6; font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; z-index: 10; transition: opacity .6s; }
      #boot h1 { font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", serif; font-size: 110px; letter-spacing: 28px; margin: 0 0 28px; color: #d9a23a; font-weight: normal; -webkit-text-stroke: 3px #1b1512; text-shadow: 7px 7px 0 #c8321f; }
      #boot .bar { position: relative; width: 420px; height: 34px; background: url("/ui/bar_frame.webp") center / 100% 100% no-repeat; }
      #boot .bar i { position: absolute; left: 4%; top: 28%; display: block; height: 44%; width: 0; max-width: 92%; background: url("/ui/bar_fill_red.webp") left center / 420px 100% no-repeat; transition: width .3s; }
      #boot p { font-size: 18px; font-weight: 700; color: #b5a384; margin-top: 20px; letter-spacing: 6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><h1>命阙</h1><div class="bar"><i id="bootbar"></i></div><p id="bootmsg">展开命书……</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
